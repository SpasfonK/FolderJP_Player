name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android (plateforme 35, build-tools 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Gradle 8.10.2 (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Le fichier binaire gradle-wrapper.jar n'est pas versionné : on génère le wrapper
      # à la volée s'il est absent, ce qui permet ensuite d'utiliser ./gradlew partout.
      - name: Générer le Gradle Wrapper si absent
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      # Tests unitaires JVM (PathNormalizer). Non bloquants : un échec est signalé
      # en avertissement mais n'empêche pas de récupérer l'APK.
      - name: Tests unitaires
        id: unit
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Signaler les tests en échec
        if: steps.unit.outcome == 'failure'
        run: |
          echo "::warning title=Tests unitaires::Au moins un test a échoué, voir l'artifact test-reports."
          echo "### ⚠️ Tests unitaires en échec" >> "$GITHUB_STEP_SUMMARY"

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Compiler l'APK release
        run: ./gradlew assembleRelease --stacktrace

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: n7Folder-Player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier l'APK release
        uses: actions/upload-artifact@v4
        with:
          name: n7Folder-Player-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
